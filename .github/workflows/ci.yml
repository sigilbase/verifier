name: tests

on:
  push:
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # sodium and zip ship with setup-php defaults; named explicitly
          # because the verifier's contract depends on them. mbstring is
          # deliberately absent from this list: verify.php must not need it.
          extensions: sodium, zip, openssl
          coverage: none

      - run: composer install --no-interaction --no-progress

      - run: vendor/bin/phpunit
