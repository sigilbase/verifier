name: tests

on:
  push:
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # sodium and zip ship with setup-php defaults; named explicitly
          # because the verifier's contract depends on them. mbstring is
          # deliberately absent from this list: verify.php must not need it.
          extensions: sodium, zip, openssl
          coverage: none

      - run: composer install --no-interaction --no-progress

      - run: vendor/bin/phpunit

      # The compiled trusted sets must equal keys/; exit 0 means up to date.
      - run: php tools/compile-keys.php

      # The committed consistency fixtures must be what the generator produces.
      - run: php tools/build-corpus-consistency.php

      # And the committed collection-record fixtures (format 1.6).
      - run: php tools/build-corpus-collection.php

      # And the shape fixtures derived from valid.zip (FORMAT.md, "Field types").
      - run: php tools/build-corpus-shape.php

      # And the receipt and registry fixtures (format 1.7, verifier 1.8).
      - run: php tools/build-corpus-registry.php

  differential:
    runs-on: ubuntu-latest
    name: Differential (verify.php vs sigilbase-verify)
    needs: [phpunit]
    steps:
      - uses: actions/checkout@v4
        with:
          path: verifier

      # The Go implementation lives in its own repository and mirrors this
      # one's corpus, vectors, keys and schema. Its differential tool runs
      # both verifiers over every fixture in this checkout's corpus and
      # fails on any difference in exit code, results or document. A change
      # to both lands as two branches of one name: when verifier-go has a
      # branch named like this one, that branch is the one held to it.
      - id: go-ref
        run: |
          branch="${{ github.head_ref || github.ref_name }}"
          if git ls-remote --exit-code --heads https://github.com/sigilbase/verifier-go.git "$branch" >/dev/null 2>&1; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          repository: sigilbase/verifier-go
          ref: ${{ steps.go-ref.outputs.ref }}
          path: verifier-go

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sodium, zip, openssl
          coverage: none

      - uses: actions/setup-go@v5
        with:
          go-version-file: verifier-go/go.mod

      - run: cd verifier-go && go build -o "$GITHUB_WORKSPACE/sigilbase-verify" ./cmd/sigilbase-verify

      - run: |
          cd verifier-go
          go run ./tools/differential -php php -verify-php verify.php \
            -go "$GITHUB_WORKSPACE/sigilbase-verify" \
            -corpus ../verifier/corpus/expected.json -dir ../verifier

      # The mirror must be exact: the two repositories release together.
      - run: |
          for f in corpus vectors keys/sigilbase.json keys/receipt-keys.json keys/tsa-roots.pem result.schema.json; do
            diff -r -q "verifier/$f" "verifier-go/$f"
          done
          diff -q verifier/verify.php verifier-go/reference/verify.php
